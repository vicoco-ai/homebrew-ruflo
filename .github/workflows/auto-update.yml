name: Auto-update formula

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

# Pipeline: open the bump PR -> test it (macOS) and have Claude verify it
# -> merge only if both pass. Each job gets the least permission it needs.
permissions: {}

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      version: ${{ steps.check.outputs.latest }}
      branch: ${{ steps.pr.outputs.branch }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for new version
        id: check
        run: |
          CURRENT=$(grep -oP 'url "https://registry.npmjs.org/ruflo/-/ruflo-\K[^"]+(?=\.tgz")' Formula/ruflo.rb)
          LATEST=$(curl -s https://registry.npmjs.org/ruflo/latest | jq -r .version)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update formula
        if: steps.check.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          URL="https://registry.npmjs.org/ruflo/-/ruflo-${VERSION}.tgz"
          SHA256=$(curl -sL "$URL" | sha256sum | awk '{print $1}')

          # Node: keep the formula's current node@X unless this ruflo
          # version's engines.node minimum has moved past it. The pin is
          # chosen by hand (a Homebrew-supported LTS), not derived from the
          # minimum, which would drag it back to an end-of-life node.
          NODE_REQ=$(curl -s "https://registry.npmjs.org/ruflo/${VERSION}" | jq -r '.engines.node // ">= 20.0.0"')
          NODE_MIN=$(echo "$NODE_REQ" | grep -oE '[0-9]+' | head -1)
          NODE_CUR=$(grep -oP 'depends_on "node@\K[0-9]+' Formula/ruflo.rb)
          echo "engines.node=$NODE_REQ min=$NODE_MIN formula=node@$NODE_CUR"

          sed -i "s|url \"https://registry.npmjs.org/ruflo/-/ruflo-.*\.tgz\"|url \"${URL}\"|" Formula/ruflo.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/ruflo.rb
          if [ "$NODE_MIN" -gt "$NODE_CUR" ]; then
            sed -i "s|depends_on \"node@.*\"|depends_on \"node@${NODE_MIN}\"|" Formula/ruflo.rb
            sed -i "s|formula_opt_bin(\"node@[0-9]*\")|formula_opt_bin(\"node@${NODE_MIN}\")|g" Formula/ruflo.rb
            sed -i "s|# node@[0-9]* is keg-only|# node@${NODE_MIN} is keg-only|" Formula/ruflo.rb
          fi

      - name: Open pull request
        id: pr
        if: steps.check.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="bump-ruflo-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/ruflo.rb
          git commit -m "Update ruflo to ${VERSION}"
          # Force-push so a re-run of the same bump updates the branch
          # instead of failing on a stale one.
          git push -f origin "$BRANCH"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr create \
              --title "Update ruflo to ${VERSION}" \
              --body "Automated version bump. A Claude verification job will comment with a PASS/FAIL verdict on this PR." \
              --base main --head "$BRANCH" \
              | grep -oE '[0-9]+$')
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          # Everything downstream tests, verifies and merges this exact
          # commit, so nothing pushed to the branch later can ride along.
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # PRs created with the built-in GITHUB_TOKEN do not trigger pull_request
  # workflows (recursion guard), so run the formula tests here as a called
  # workflow. That also lets the merge job wait on the result.
  test:
    needs: check-and-update
    if: needs.check-and-update.outputs.needs_update == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.check-and-update.outputs.head_sha }}
    secrets: inherit

  verify-bump:
    needs: check-and-update
    if: needs.check-and-update.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check-and-update.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify version bump with Claude
        id: verify
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A scheduled job bumped Formula/ruflo.rb to ruflo version
            ${{ needs.check-and-update.outputs.version }} on this branch and
            opened PR #${{ needs.check-and-update.outputs.pr_number }}.
            Independently verify the bump. CLAUDE.md describes what a correct
            bump changes. Checks:

            1. sha256: download the tarball from the url in the formula and
               recompute its sha256; it must equal the formula's sha256.
            2. node version: fetch the version's metadata from
               https://registry.npmjs.org/ruflo/<version> and read
               engines.node. The formula's depends_on "node@X" and every
               formula_opt_bin("node@X") reference must use the same major X, and X
               must satisfy engines.node.
            3. diff sanity: run `git diff origin/main -- Formula/ruflo.rb`
               and confirm only the url, sha256, and node@ lines changed.

            Then post exactly one comment on the PR using:
              gh pr comment ${{ needs.check-and-update.outputs.pr_number }} --body "..."
            The comment must start with "Verdict: PASS" or "Verdict: FAIL"
            followed by one line of evidence per check. If any check fails,
            the verdict is FAIL with a precise explanation of what is wrong.

            Finally, return the same verdict as your structured output. It
            decides whether the PR is merged automatically, so return FAIL
            if you could not complete a check or are unsure of any of them.
          claude_args: |
            --max-turns 25
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","FAIL"]},"reason":{"type":"string"}},"required":["verdict","reason"],"additionalProperties":false}'
            --allowedTools "Read,Grep,Glob,Bash(curl:*),Bash(sha256sum:*),Bash(jq:*),Bash(awk:*),Bash(grep:*),Bash(cut:*),Bash(head:*),Bash(cat:*),Bash(echo:*),Bash(git diff:*),Bash(git fetch:*),Bash(git log:*),Bash(gh pr comment:*)"

      # Fail the job (and so block the merge) unless Claude returned an
      # explicit PASS. A missing or unparseable verdict counts as FAIL.
      - name: Require PASS verdict
        env:
          STRUCTURED_OUTPUT: ${{ steps.verify.outputs.structured_output }}
        run: |
          echo "structured output: ${STRUCTURED_OUTPUT:-<none>}"
          VERDICT=$(jq -r '.verdict // "FAIL"' <<<"${STRUCTURED_OUTPUT:-null}" || echo FAIL)
          test "$VERDICT" = "PASS"

  # Runs only when both gates succeeded: the macOS formula tests (install,
  # brew test, brew audit, headless Claude gate) and Claude's bump verdict.
  merge:
    needs: [check-and-update, test, verify-bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.check-and-update.outputs.pr_number }}
      HEAD_SHA: ${{ needs.check-and-update.outputs.head_sha }}
    steps:
      - name: Merge bump PR
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"

      # Older bump PRs are obsolete once a newer version is on main.
      - name: Close superseded bump PRs
        run: |
          gh pr list --state open --limit 200 \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not)
                      | select(.headRefName | startswith("bump-ruflo-"))
                      | .number' |
          while read -r N; do
            [ "$N" = "$PR_NUMBER" ] && continue
            gh pr close "$N" --delete-branch \
              --comment "Superseded by #${PR_NUMBER}." || true
            sleep 1
          done
