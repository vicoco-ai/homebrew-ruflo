name: Test formula

on:
  pull_request:
    paths:
      - "Formula/**"
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/vicoco-ai"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/vicoco-ai/homebrew-ruflo"

      - name: Install formula
        run: |
          # Pre-built native addon (ripgrep.node) in a transitive dependency has
          # insufficient Mach-O header padding for Homebrew's dylib ID rewrite.
          # The install completes and the binary works; only the linkage fixer
          # returns non-zero, so we allow that and verify the binary below.
          brew install vicoco-ai/ruflo/ruflo || true

      - name: Verify installation
        run: |
          test -x "$(brew --prefix)/bin/ruflo"
          ruflo --version

      - name: Test formula
        run: brew test vicoco-ai/ruflo/ruflo

      - name: Audit formula
        run: brew audit --strict --formula vicoco-ai/ruflo/ruflo

      # Headless Claude gate: `claude -p` (no GitHub action) must return a
      # machine-readable PASS verdict or this job — and thus the PR check —
      # fails. Two JSON layers: the CLI's envelope (is_error, result, ...)
      # and the verdict object we ask the model to emit inside .result.
      - name: Claude verdict gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code

          PROMPT=$(cat <<'EOF'
          You are a release gate for this Homebrew tap. Assess whether
          Formula/ruflo.rb is sound enough to ship:

          1. Run: brew audit --strict --formula vicoco-ai/ruflo/ruflo
             (it must pass; warnings it prints are FAIL evidence)
          2. Read Formula/ruflo.rb and check internal consistency:
             the version in the url looks sane, sha256 is a 64-char hex
             string, and depends_on "node@X" agrees with every
             Formula["node@X"] reference.

          Respond with ONLY a single JSON object on one line, no markdown
          fences, no prose before or after, in exactly this shape:
          {"verdict":"PASS","checks":[{"name":"audit","ok":true,"detail":"..."},{"name":"consistency","ok":true,"detail":"..."}]}
          Use "verdict":"FAIL" and "ok":false with a precise detail for
          anything wrong. If you cannot complete a check, that check is
          not ok and the verdict is FAIL.
          EOF
          )

          # Capture exit code and stderr without dying: under `bash -e` a
          # non-zero claude exit would otherwise abort before the
          # diagnostics below ever print.
          set +e
          RESULT=$(claude -p "$PROMPT" \
            --output-format json \
            --allowedTools "Read,Bash(brew audit:*)" \
            --max-turns 12 \
            2>/tmp/claude-stderr.log)
          CLAUDE_EXIT=$?
          set -e

          echo "--- claude exit: $CLAUDE_EXIT ---"
          echo "--- stderr ---"
          cat /tmp/claude-stderr.log || true
          echo "--- CLI envelope ---"
          echo "$RESULT" | jq '{is_error, subtype, num_turns, total_cost_usd, permission_denials_count: (.permission_denials | length? // .permission_denials_count)}' || echo "$RESULT"

          test "$CLAUDE_EXIT" -eq 0
          test "$(echo "$RESULT" | jq -r .is_error)" = "false"

          RAW=$(echo "$RESULT" | jq -r .result)
          echo "--- raw result ---"
          echo "$RAW"

          # Extract the verdict object structurally: models sometimes wrap
          # the JSON in fences or prose despite instructions, so grab the
          # first {...} line rather than trusting the format.
          VERDICT_JSON=$(echo "$RAW" | grep -o '{.*}' | head -1)
          echo "--- verdict ---"
          echo "$VERDICT_JSON" | jq .

          test "$(echo "$VERDICT_JSON" | jq -r .verdict)" = "PASS"
